<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Avaliação 360 · Grupo RPE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Spectral:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --black:#0F0F0F; --dark:#1A1A1A; --space-gray:#313131;
  --off-white:#F5F4F0; --white:#FFFFFF; --green:#00B73D; --green-dark:#009932;
  --f-display:'Anton',sans-serif; --f-serif:'Spectral',serif; --f-body:'DM Sans',sans-serif;
  --ease:cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--off-white);color:var(--black);font-family:var(--f-body);line-height:1.65;
     -webkit-font-smoothing:antialiased}
.wrap{max-width:900px;margin:0 auto;padding:0 24px}
@media(min-width:900px){.wrap{padding:0 48px}}

/* ---------- topo ---------- */
header{background:var(--black);color:var(--off-white);position:relative;overflow:hidden}
header .mark{position:absolute;right:-.04em;bottom:-.18em;font-family:var(--f-serif);font-weight:600;
  font-size:clamp(9rem,26vw,18rem);color:rgba(245,244,240,.03);line-height:1;pointer-events:none;letter-spacing:-.03em}
header .inner{position:relative;z-index:1;padding:40px 0 44px}
.brand{font-family:var(--f-serif);font-weight:600;letter-spacing:-.03em;font-size:1.5rem;color:var(--off-white)}
.section-label{display:flex;align-items:center;gap:8px;font-size:10px;font-weight:700;
  text-transform:uppercase;letter-spacing:.18em;color:var(--green)}
.section-label::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--green);flex:none}
h1{font-family:var(--f-display);text-transform:uppercase;line-height:.92;
   font-size:clamp(1.75rem,6.4vw,4.2rem);color:var(--off-white);overflow-wrap:anywhere}
h1 em{font-style:normal;color:var(--green)}
.sub{font-family:var(--f-serif);font-style:italic;font-size:1.125rem;color:rgba(245,244,240,.55);
  margin-top:14px;max-width:56ch}

/* ---------- barra de progresso ---------- */
.progress-bar{background:var(--dark);border-top:1px solid var(--space-gray);color:var(--off-white)}
.progress-bar .inner{padding:18px 0;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.track{flex:1;min-width:160px;height:6px;background:rgba(245,244,240,.12)}
.track > i{display:block;height:100%;background:var(--green);width:0;transition:width .5s var(--ease)}
.tiny{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.14em}
.tiny.dim{color:rgba(245,244,240,.45)}

/* ---------- cards de pauta ---------- */
main{padding:48px 0 96px}
.group-title{font-family:var(--f-display);text-transform:uppercase;font-size:1.1rem;letter-spacing:.02em;
  margin:40px 0 4px}
.group-desc{font-size:.875rem;color:rgba(15,15,15,.55);margin-bottom:16px}
.card{background:var(--white);border:1px solid rgba(15,15,15,.1);padding:20px 22px;
  display:flex;align-items:center;gap:16px;cursor:pointer;transition:all .2s var(--ease);
  width:100%;text-align:left;font-family:inherit;font-size:inherit;margin-bottom:10px}
.card:hover{border-color:var(--black);transform:translateY(-2px)}
.card[data-done="1"]{background:rgba(0,183,61,.06);border-color:rgba(0,183,61,.4);cursor:default}
.card[data-done="1"]:hover{transform:none}
.avatar{width:44px;height:44px;background:var(--black);color:var(--off-white);flex:none;
  display:grid;place-items:center;font-family:var(--f-display);font-size:1.05rem;letter-spacing:.02em}
.card[data-done="1"] .avatar{background:var(--green);color:var(--black)}
.card .who{min-width:0}
.card .nome{display:block;font-weight:600;font-size:1.0625rem;line-height:1.3}
.card .cargo{display:block;font-size:.8125rem;color:rgba(15,15,15,.55);line-height:1.35}
.badge{display:inline-flex;align-items:center;font-size:10px;font-weight:700;text-transform:uppercase;
  letter-spacing:.12em;padding:5px 10px;line-height:1;flex:none}
.badge-green{background:var(--green);color:var(--black)}
.badge-black{background:var(--black);color:var(--off-white)}
.badge-outline{border:1px solid rgba(15,15,15,.3);color:rgba(15,15,15,.65)}
.spacer{flex:1}
.filtro{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 4px}
.filtro input{font-family:var(--f-body);font-size:.9375rem;flex:1;min-width:180px;background:var(--white);
  border:1px solid rgba(15,15,15,.22);padding:11px 14px;outline:none;color:var(--black)}
.filtro input:focus{border-color:var(--green)}

/* ---------- formulário ---------- */
.form-head{background:var(--black);color:var(--off-white);padding:28px 0 30px;position:relative}
.form-head .cargo{font-family:var(--f-serif);font-style:italic;color:rgba(245,244,240,.6);font-size:1.05rem}
.item{border-top:1px solid rgba(15,15,15,.12);padding:26px 0}
.item:first-of-type{border-top:none}
.item h3{font-family:var(--f-body);font-weight:600;font-size:1.0625rem;line-height:1.35}
.item p{font-size:.875rem;color:rgba(15,15,15,.6);margin-top:4px;max-width:62ch}
.scale{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin-top:16px;max-width:460px}
.opt{border:1px solid rgba(15,15,15,.22);background:transparent;cursor:pointer;font-family:var(--f-body);
  padding:10px 2px;text-align:center;transition:all .15s var(--ease);min-width:0}
.opt .n{display:block;font-family:var(--f-display);font-size:1.1rem;line-height:1}
.opt .l{display:block;font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
  color:rgba(15,15,15,.45);margin-top:3px}
.opt:hover{border-color:var(--black)}
.opt[aria-pressed="true"]{background:var(--black);color:var(--off-white);border-color:var(--black)}
.opt[aria-pressed="true"] .l{color:rgba(245,244,240,.6)}
.opt.na .n{font-family:var(--f-body);font-size:.8125rem;font-weight:700;padding-top:4px}
.legend{font-size:11px;color:rgba(15,15,15,.5);margin-top:10px;display:none}
@media(max-width:560px){
  .opt .l{display:none}
  .opt{padding:12px 2px}
  .opt.na .n{padding-top:0}
  .item:first-of-type .legend{display:block}
}
.field{margin-top:8px}
label.lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.15em;
  color:rgba(15,15,15,.6);display:block;margin-bottom:8px}
textarea,select{font-family:var(--f-body);font-size:1rem;width:100%;background:var(--white);
  border:1px solid rgba(15,15,15,.22);padding:12px 14px;outline:none;transition:border-color .2s;color:var(--black)}
textarea{min-height:96px;resize:vertical;line-height:1.55}
textarea:focus,select:focus{border-color:var(--green)}
.hint{font-size:11px;color:rgba(15,15,15,.45);margin-top:6px}
.box-gestor{background:var(--white);border:1px solid rgba(15,15,15,.12);padding:24px;margin-top:24px}
.box-gestor .section-label{color:var(--black)}
.box-gestor .section-label::before{background:var(--green)}
.grid2{display:grid;grid-template-columns:1fr;gap:16px;margin-top:18px}
@media(min-width:640px){.grid2{grid-template-columns:1fr 1fr}}

.btn{font-family:var(--f-body);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;
  padding:15px 30px;border:none;cursor:pointer;display:inline-flex;align-items:center;gap:10px;
  transition:all .2s var(--ease);text-decoration:none}
.btn-primary{background:var(--black);color:var(--off-white)}
.btn-primary:hover{background:var(--dark);transform:translateY(-1px)}
.btn-green{background:var(--green);color:var(--black)}
.btn-green:hover{background:var(--green-dark);transform:translateY(-1px)}
.btn-ghost{background:transparent;color:rgba(15,15,15,.65);border:1px solid rgba(15,15,15,.25)}
.btn-ghost:hover{border-color:var(--black);color:var(--black)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:32px;
  padding-top:24px;border-top:1px solid rgba(15,15,15,.12)}
.msg{font-size:.875rem;font-weight:500}
.msg.err{color:#B3001B}
.msg.ok{color:var(--green-dark)}

.note{border-left:3px solid var(--green);background:rgba(15,15,15,.03);padding:18px 22px;margin-top:24px}
.note p{font-family:var(--f-serif);font-size:1.0625rem;line-height:1.5}
.note .who{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.12em;
  color:rgba(15,15,15,.45);margin-top:10px}
.center{text-align:center;padding:80px 0}
.hidden{display:none!important}
footer{border-top:1px solid rgba(15,15,15,.1);padding:28px 0;font-size:11px;
  color:rgba(15,15,15,.45);text-align:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120%);
  background:var(--black);color:var(--off-white);padding:14px 24px;font-size:12px;font-weight:600;
  text-transform:uppercase;letter-spacing:.1em;transition:transform .35s var(--ease);z-index:50}
.toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<header>
  <div class="mark">RPE</div>
  <div class="wrap inner">
    <div class="brand">RPE</div>
    <div class="section-label" style="margin:22px 0 14px" id="hCiclo">Grupo RPE</div>
    <h1 id="hTitle">CARREGANDO…</h1>
    <p class="sub" id="hSub">Um instante.</p>
  </div>
</header>

<div class="progress-bar hidden" id="pbar">
  <div class="wrap inner">
    <span class="tiny" id="pTxt">0 DE 0 ENVIADAS</span>
    <span class="track"><i id="pFill"></i></span>
    <span class="tiny dim" id="pPrazo"></span>
  </div>
</div>

<main class="wrap">
  <!-- LISTA -->
  <section id="viewList" class="hidden"></section>

  <!-- FORMULÁRIO -->
  <section id="viewForm" class="hidden"></section>

  <!-- ERRO / ESTADOS -->
  <section id="viewMsg" class="center hidden"></section>
</main>

<footer class="wrap">
  Grupo RPE · Ciclo anual de avaliação · Respostas de pares e do time são apresentadas de forma agregada e anônima.
</footer>

<div class="toast" id="toast"></div>

<script>
const API = 'https://lqycimhfklufueclkzfr.supabase.co/functions/v1/avaliacao';
const TOKEN = new URLSearchParams(location.search).get('t') || '';
let DATA = null, CUR = null, dirty = false, autosaveTimer = null;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => (
  {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const ESCALA_PADRAO = [
  {v:1, r:'Muito abaixo'}, {v:2, r:'Abaixo'}, {v:3, r:'Atende'},
  {v:4, r:'Acima'}, {v:5, r:'Referência'}, {v:'NA', r:'Não observei'}
];

/* escala vem do ciclo; separa as notas numéricas do "não observei" */
function escalaDoCiclo(){
  const e = (DATA && DATA.ciclo && Array.isArray(DATA.ciclo.escala) && DATA.ciclo.escala.length)
    ? DATA.ciclo.escala : ESCALA_PADRAO;
  return {
    notas: e.filter(s => s.v !== 'NA'),
    na: e.find(s => s.v === 'NA') || {v:'NA', r:'Não observei'}
  };
}
/* "Abaixo do esperado" -> "Abaixo do<br>esperado" para caber no botão */
function quebra(txt){
  const p = String(txt).trim().split(/\s+/);
  if (p.length < 2) return esc(txt);
  const corte = Math.ceil(p.length / 2);
  return esc(p.slice(0, corte).join(' ')) + '<br>' + esc(p.slice(corte).join(' '));
}

const NOME_BLOCO = {
  nucleo:'Comportamentos essenciais RPE',
  nucleo_op:'Os essenciais RPE no dia a dia',
  atd:'Atendimento e execução no salão',
  dir:'Competências de diretoria',
  ger:'Competências de gestão',
  asn:'Competências de execução',
  lid:'Liderança'
};

const TIPO_INFO = {
  auto:        {badge:'Autoavaliação', cls:'badge-black',
                title:'Autoavaliação',
                desc:'Como você avalia o seu próprio ano. Seja honesto — isso guia a conversa com o seu gestor.'},
  ascendente:  {badge:'Meu gestor', cls:'badge-green',
                title:'Avaliação do seu gestor',
                desc:'Sua visão sobre quem lidera você. Respostas agregadas e anônimas — o gestor vê médias, nunca quem respondeu o quê.'},
  descendente: {badge:'Meu time', cls:'badge-black',
                title:'Pessoas que você lidera',
                desc:'Sua avaliação como gestor direto. Esta é a única fonte identificada — vira a base da conversa de feedback.'},
  par:         {badge:'Par', cls:'badge-outline',
                title:'Pares',
                desc:'Pessoas com quem você trabalha lado a lado. Respostas agregadas e anônimas.'}
};

function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2200); }

async function call(action, body){
  const r = await fetch(API, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(Object.assign({action, token:TOKEN}, body||{}))
  });
  return r.json();
}

function iniciais(nome){
  const p = String(nome).trim().split(/\s+/);
  return ((p[0]||'')[0] + (p.length>1 ? (p[p.length-1]||'')[0] : '')).toUpperCase();
}

function itensDa(av){
  const blocos = av.blocos || [];
  return DATA.itens.filter(i => blocos.includes(i.bloco));
}

/* texto do item: na autoavaliação usa a versão em 1ª pessoa, quando existe */
function tituloItem(i, av){
  return (av.tipo === 'auto' && i.pergunta_auto) ? i.pergunta_auto : i.titulo;
}

function completa(av){
  const req = itensDa(av).map(i => i.codigo);
  const r = av.respostas || {};
  const todos = req.every(c => r[c] !== undefined && r[c] !== null && r[c] !== '');
  const txt = (av.ponto_forte||'').trim().length >= 15 && (av.ponto_desenvolver||'').trim().length >= 15;
  const gestor = !av.pede_bloco_gestor ||
    (av.nota_geral && av.potencial && av.risco_perda && av.prontidao);
  return todos && txt && gestor;
}

/* ============================ LISTA ============================ */
function renderList(){
  CUR = null;
  $('viewForm').classList.add('hidden');
  $('viewMsg').classList.add('hidden');
  const el = $('viewList'); el.classList.remove('hidden');

  const av = DATA.avaliacoes;
  const done = av.filter(a => a.status === 'enviada').length;
  $('hTitle').innerHTML = 'OLÁ,<br><em>' + esc(DATA.avaliador.primeiro_nome.toUpperCase()) + '</em>';
  $('hSub').textContent = done === av.length
    ? 'Tudo enviado. Obrigado — o RH assume daqui.'
    : 'Você tem ' + (av.length - done) + ' avaliação(ões) para preencher. Leva cerca de 3 minutos cada uma.';

  $('pbar').classList.remove('hidden');
  $('pTxt').textContent = done + ' DE ' + av.length + ' ENVIADAS';
  $('pFill').style.width = (av.length ? (done/av.length*100) : 0) + '%';
  if (DATA.ciclo.fecha_em){
    const d = new Date(DATA.ciclo.fecha_em + 'T12:00:00');
    $('pPrazo').textContent = 'PRAZO: ' + d.toLocaleDateString('pt-BR',{day:'2-digit',month:'long'});
  }

  let html = '';
  if (done === av.length && av.length > 0){
    html += '<div class="note" style="margin-top:32px"><p>Suas respostas foram registradas. '
         + 'O RH consolida os resultados e agenda a conversa de feedback.</p>'
         + '<div class="who">Grupo RPE · ' + esc(DATA.ciclo.nome) + '</div></div>';
  }

  /* pauta longa (gerente de operação com 30 pessoas) ganha busca */
  const muitos = av.length > 12;
  if (muitos && done < av.length){
    html += '<div class="filtro"><input id="qNome" type="search" placeholder="Buscar por nome ou função…" '
         + 'autocomplete="off"></div>';
  }

  ['auto','ascendente','descendente','par'].forEach(tipo => {
    const grupo = av.filter(a => a.tipo === tipo);
    if (!grupo.length) return;
    const info = TIPO_INFO[tipo];
    html += '<h2 class="group-title">' + esc(info.title) + '</h2>';
    html += '<p class="group-desc">' + esc(info.desc) + '</p>';
    grupo.forEach(a => {
      const enviada = a.status === 'enviada';
      const rasc = a.status === 'rascunho';
      const sub = [a.cargo, a.area].filter(Boolean).join(' · ');
      html += '<button class="card" data-done="'+(enviada?1:0)+'" data-id="'+a.id+'"'
           + ' data-q="' + esc(((a.nome||'') + ' ' + (a.cargo||'') + ' ' + (a.area||'')).toLowerCase()) + '"'
           + (enviada?' disabled':'') + '>'
           + '<span class="avatar">' + esc(iniciais(a.nome)) + '</span>'
           + '<span class="who"><span class="nome">' + esc(a.tipo==='auto' ? 'Você mesmo' : a.nome) + '</span>'
           + '<span class="cargo">' + esc(sub) + '</span></span>'
           + '<span class="spacer"></span>'
           + '<span class="badge ' + (enviada ? 'badge-green' : rasc ? 'badge-outline' : 'badge-black') + '">'
           + (enviada ? 'Enviada' : rasc ? 'Rascunho' : 'Preencher') + '</span>'
           + '</button>';
    });
  });
  el.innerHTML = html;
  el.querySelectorAll('.card:not([disabled])').forEach(b =>
    b.addEventListener('click', () => openForm(b.dataset.id)));

  const q = $('qNome');
  if (q) q.addEventListener('input', () => {
    const t = q.value.trim().toLowerCase();
    el.querySelectorAll('.card').forEach(c =>
      c.classList.toggle('hidden', !!t && (c.dataset.q||'').indexOf(t) === -1));
  });

  window.scrollTo({top:0, behavior:'smooth'});
}

/* ============================ FORM ============================ */
function openForm(id){
  CUR = DATA.avaliacoes.find(a => a.id === id);
  if (!CUR) return;
  CUR.respostas = CUR.respostas || {};
  dirty = false;
  $('viewList').classList.add('hidden');
  $('viewMsg').classList.add('hidden');
  const el = $('viewForm'); el.classList.remove('hidden');

  const info = TIPO_INFO[CUR.tipo];
  const alvo = CUR.tipo === 'auto' ? 'você mesmo' : CUR.nome;
  const prim = CUR.tipo === 'auto' ? 'você mesmo' : (CUR.primeiro_nome || CUR.nome);
  $('hTitle').innerHTML = esc((CUR.tipo==='auto' ? 'AUTOAVALIAÇÃO' : CUR.nome).toUpperCase());
  $('hSub').textContent = CUR.tipo === 'auto'
    ? 'Sua leitura sobre o próprio ano.'
    : [CUR.cargo, CUR.area].filter(Boolean).join(' · ') + ' — ' + info.desc;

  const itens = itensDa(CUR);
  const ESC = escalaDoCiclo();
  let html = '<div style="margin-top:36px" class="section-label">' + esc(info.badge) + '</div>';

  html += '<div class="note" style="margin-top:16px"><p>' + esc(
      CUR.tipo === 'descendente'
        ? 'Esta avaliação é identificada e vira a base da conversa de feedback com ' + alvo + '.'
        : CUR.tipo === 'auto'
        ? 'Ninguém acerta 5 em tudo. Uma autoavaliação honesta vale muito mais do que uma generosa.'
        : 'Suas respostas entram na média junto com as dos outros avaliadores. ' + alvo + ' nunca saberá quem respondeu o quê.'
    ) + '</p></div>';

  html += '<div style="margin-top:8px">';
  let blocoAtual = '';
  itens.forEach(i => {
    if (i.bloco !== blocoAtual){
      blocoAtual = i.bloco;
      const nomeBloco = NOME_BLOCO[i.bloco] || '';
      html += '<h2 class="group-title" style="margin-top:34px">' + esc(nomeBloco) + '</h2>';
    }
    const val = CUR.respostas[i.codigo];
    html += '<div class="item"><h3>' + esc(tituloItem(i, CUR)) + '</h3><p>' + esc(i.descricao) + '</p>'
         + '<div class="scale" data-cod="' + i.codigo + '">';
    ESC.notas.forEach(s => {
      html += '<button type="button" class="opt" data-v="' + s.v + '" aria-pressed="'
           + (String(val) === String(s.v)) + '"><span class="n">' + s.v
           + '</span><span class="l">' + quebra(s.r) + '</span></button>';
    });
    html += '<button type="button" class="opt na" data-v="NA" aria-pressed="' + (val === 'NA')
         + '"><span class="n">N/O</span><span class="l">' + quebra(ESC.na.r) + '</span></button>';
    html += '</div><div class="legend">'
         + ESC.notas.map(s => s.v + ' ' + s.r.toLowerCase()).join(' · ')
         + ' · N/O ' + ESC.na.r.toLowerCase() + '</div>';
    html += '</div>';
  });
  html += '</div>';

  html += '<div class="item" style="border-top:1px solid rgba(15,15,15,.12)">'
       + '<label class="lbl" for="f_forte">O que ' + esc(CUR.tipo==='auto'?'você faz':prim+' faz')
       + ' muito bem e deve continuar fazendo?</label>'
       + '<textarea id="f_forte" placeholder="Seja concreto: cite uma situação, um turno, um comportamento.">'
       + esc(CUR.ponto_forte) + '</textarea>'
       + '<div class="hint">Mínimo 15 caracteres. Exemplos ajudam mais do que adjetivos.</div></div>';

  html += '<div class="item">'
       + '<label class="lbl" for="f_dev">O que ' + esc(CUR.tipo==='auto'?'você deveria':prim+' deveria')
       + ' começar a fazer (ou fazer diferente) para ter mais impacto no próximo ciclo?</label>'
       + '<textarea id="f_dev" placeholder="Uma coisa só, bem escolhida, vale mais do que cinco genéricas.">'
       + esc(CUR.ponto_desenvolver) + '</textarea>'
       + '<div class="hint">Mínimo 15 caracteres.</div></div>';

  if (CUR.pede_clima){
    html += '<div class="item">'
         + '<label class="lbl" for="f_clima">Como está o clima na sua casa? O que ajudaria o time a trabalhar melhor?</label>'
         + '<textarea id="f_clima" placeholder="Pode falar de escala, equipamento, comunicação, relação com a liderança — o que você quiser.">'
         + esc(CUR.clima_casa) + '</textarea>'
         + '<div class="hint">Opcional. Vai para o RH de forma agregada, junto com as respostas dos colegas.</div></div>';
  }

  if (CUR.pede_bloco_gestor){
    html += '<div class="box-gestor"><div class="section-label">Bloco do gestor · Calibração</div>'
         + '<p class="hint" style="margin-top:10px">Visível apenas para RH e diretoria. Usado na reunião de calibração.</p>'
         + '<div class="grid2">'
         + sel('g_nota','Desempenho geral no ciclo', CUR.nota_geral, [
             ['5','5 · Referência no grupo'],['4','4 · Acima do esperado'],['3','3 · Atende ao esperado'],
             ['2','2 · Precisa melhorar'],['1','1 · Abaixo do esperado']])
         + sel('g_pot','Potencial de crescimento', CUR.potencial, [
             ['alto','Alto'],['medio','Médio'],['baixo','Baixo']])
         + sel('g_risco','Risco de perder essa pessoa', CUR.risco_perda, [
             ['alto','Alto'],['medio','Médio'],['baixo','Baixo']])
         + sel('g_pront','Prontidão para o próximo passo', CUR.prontidao, [
             ['pronto_agora','Pronto agora'],['1_2_anos','Em 1 a 2 anos'],['mais_2_anos','Em mais de 2 anos'],
             ['nao_no_momento','Não no momento'],['nao_se_aplica','Não se aplica']])
         + '</div>'
         + '<div class="field" style="margin-top:20px"><label class="lbl" for="g_rh">Comentário confidencial para o RH (opcional)</label>'
         + '<textarea id="g_rh" placeholder="Contexto que ajuda o RH e que não entra na conversa de feedback.">'
         + esc(CUR.comentario_rh) + '</textarea></div></div>';
  }

  html += '<div class="actions">'
       + '<button class="btn btn-green" id="btnSend">Enviar avaliação →</button>'
       + '<button class="btn btn-ghost" id="btnDraft">Salvar rascunho</button>'
       + '<button class="btn btn-ghost" id="btnBack">Voltar</button>'
       + '<span class="msg" id="fMsg"></span></div>';

  el.innerHTML = html;

  el.querySelectorAll('.scale').forEach(sc => {
    sc.addEventListener('click', e => {
      const b = e.target.closest('.opt'); if (!b) return;
      sc.querySelectorAll('.opt').forEach(o => o.setAttribute('aria-pressed','false'));
      b.setAttribute('aria-pressed','true');
      CUR.respostas[sc.dataset.cod] = b.dataset.v === 'NA' ? 'NA' : parseInt(b.dataset.v,10);
      dirty = true; queueAutosave();
    });
  });
  el.querySelectorAll('textarea, select').forEach(f =>
    f.addEventListener('input', () => { dirty = true; queueAutosave(); }));

  $('btnBack').addEventListener('click', async () => {
    if (dirty) await save(false, true);
    renderList();
  });
  $('btnDraft').addEventListener('click', () => save(false));
  $('btnSend').addEventListener('click', () => save(true));
  window.scrollTo({top:0, behavior:'smooth'});
}

function sel(id, label, val, opts){
  let h = '<div class="field"><label class="lbl" for="'+id+'">'+esc(label)+'</label><select id="'+id+'">'
        + '<option value="">— selecione —</option>';
  opts.forEach(o => h += '<option value="'+o[0]+'"'+(String(val)===o[0]?' selected':'')+'>'+esc(o[1])+'</option>');
  return h + '</select></div>';
}

function collect(){
  const p = {
    respostas: CUR.respostas,
    ponto_forte: ($('f_forte')||{}).value || '',
    ponto_desenvolver: ($('f_dev')||{}).value || ''
  };
  if (CUR.pede_clima) p.clima_casa = ($('f_clima')||{}).value || '';
  if (CUR.pede_bloco_gestor){
    p.nota_geral = $('g_nota').value || null;
    p.potencial = $('g_pot').value || '';
    p.risco_perda = $('g_risco').value || '';
    p.prontidao = $('g_pront').value || '';
    p.comentario_rh = $('g_rh').value || '';
  }
  return p;
}

function applyLocal(p){
  CUR.ponto_forte = p.ponto_forte; CUR.ponto_desenvolver = p.ponto_desenvolver;
  if (CUR.pede_clima) CUR.clima_casa = p.clima_casa;
  if (CUR.pede_bloco_gestor){
    CUR.nota_geral = p.nota_geral; CUR.potencial = p.potencial;
    CUR.risco_perda = p.risco_perda; CUR.prontidao = p.prontidao;
    CUR.comentario_rh = p.comentario_rh;
  }
}

function queueAutosave(){
  clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(() => { if (dirty) save(false, true); }, 8000);
}

async function save(enviar, silent){
  if (!CUR) return;
  const p = collect(); applyLocal(p);
  const msg = $('fMsg');

  if (enviar && !completa(CUR)){
    const faltam = [];
    const semNota = itensDa(CUR).filter(i => CUR.respostas[i.codigo] === undefined || CUR.respostas[i.codigo] === '');
    if (semNota.length) faltam.push(semNota.length + ' competência(s) sem nota');
    if ((p.ponto_forte||'').trim().length < 15) faltam.push('o que continuar fazendo');
    if ((p.ponto_desenvolver||'').trim().length < 15) faltam.push('o que fazer diferente');
    if (CUR.pede_bloco_gestor && !(p.nota_geral && p.potencial && p.risco_perda && p.prontidao))
      faltam.push('bloco do gestor');
    msg.className = 'msg err';
    msg.textContent = 'Falta preencher: ' + faltam.join(', ') + '.';
    return;
  }

  if (!silent){ msg.className='msg'; msg.textContent='Salvando…'; }
  const r = await call('salvar', {avaliacao_id: CUR.id, payload: p, enviar: !!enviar});
  if (!r || !r.ok){
    msg.className='msg err';
    msg.textContent = 'Não foi possível salvar (' + ((r&&r.erro)||'erro') + '). Tente novamente.';
    return;
  }
  dirty = false;
  CUR.status = r.status;
  if (enviar){ toast('Avaliação enviada'); renderList(); }
  else if (!silent){ msg.className='msg ok'; msg.textContent='Rascunho salvo.'; }
  else { toast('Rascunho salvo'); }
}

/* ============================ BOOT ============================ */
async function boot(){
  if (!TOKEN){ return fail('Link inválido',
    'Use o link pessoal que você recebeu. Ele já identifica você — não precisa de senha.'); }
  let r;
  try { r = await call('pauta'); }
  catch(e){ return fail('Erro de conexão','Recarregue a página em alguns instantes.'); }

  if (!r || !r.ok){
    if (r && r.erro === 'token_invalido')
      return fail('Link não reconhecido','Confira se copiou o endereço inteiro da mensagem, ou fale com o RH.');
    return fail('Algo saiu do lugar','Tente novamente ou avise o RH.');
  }
  DATA = r;
  if (DATA.ciclo && DATA.ciclo.nome) $('hCiclo').textContent = DATA.ciclo.nome;
  if (!DATA.ciclo.aberto) return fail('Ciclo encerrado','O período de preenchimento já foi fechado. Fale com o RH.');
  renderList();
}

function fail(t, s){
  $('hTitle').textContent = t.toUpperCase();
  $('hSub').textContent = s;
  $('viewMsg').classList.remove('hidden');
  $('viewMsg').innerHTML = '<p style="font-family:var(--f-serif);font-size:1.125rem;color:rgba(15,15,15,.6)">'
    + 'Precisa de ajuda? Fale com o RH do Grupo RPE.</p>';
}

window.addEventListener('beforeunload', e => { if (dirty){ e.preventDefault(); e.returnValue=''; } });
boot();
</script>
