<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Relatórios 360 · Grupo RPE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Spectral:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--black:#0F0F0F;--dark:#1A1A1A;--space-gray:#313131;--off-white:#F5F4F0;
 --white:#FFF;--green:#00B73D;--green-dark:#009932;--red:#B3001B;
 --f-display:'Anton',sans-serif;--f-serif:'Spectral',serif;--f-body:'DM Sans',sans-serif;
 --ease:cubic-bezier(.4,0,.2,1)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--off-white);color:var(--black);font-family:var(--f-body);line-height:1.6;
 -webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}
@media(min-width:900px){.wrap{padding:0 40px}}

header{background:var(--black);color:var(--off-white);position:relative;overflow:hidden}
header .mark{position:absolute;right:-.04em;bottom:-.2em;font-family:var(--f-serif);font-weight:600;
 font-size:clamp(8rem,22vw,15rem);color:rgba(245,244,240,.03);line-height:1;letter-spacing:-.03em}
header .inner{position:relative;z-index:1;padding:32px 0 36px}
.brand{font-family:var(--f-serif);font-weight:600;letter-spacing:-.03em;font-size:1.4rem}
.section-label{display:flex;align-items:center;gap:8px;font-size:10px;font-weight:700;
 text-transform:uppercase;letter-spacing:.18em;color:var(--green)}
.section-label::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--green);flex:none}
h1{font-family:var(--f-display);text-transform:uppercase;line-height:.92;
 font-size:clamp(1.8rem,6vw,3.4rem);margin-top:14px;overflow-wrap:anywhere}
h1 em{font-style:normal;color:var(--green)}
.sub{font-family:var(--f-serif);font-style:italic;font-size:1.05rem;color:rgba(245,244,240,.55);margin-top:10px}

nav.pessoas{background:var(--dark);border-top:1px solid var(--space-gray);position:sticky;top:0;z-index:20}
nav.pessoas .inner{display:flex;gap:6px;overflow-x:auto;padding:12px 0;scrollbar-width:thin}
nav.pessoas button{flex:none;background:transparent;border:1px solid rgba(245,244,240,.18);
 color:rgba(245,244,240,.65);font-family:var(--f-body);font-size:12px;font-weight:600;
 padding:8px 14px;cursor:pointer;white-space:nowrap;transition:all .15s var(--ease)}
nav.pessoas button:hover{border-color:var(--off-white);color:var(--off-white)}
nav.pessoas button[aria-current="true"]{background:var(--green);color:var(--black);border-color:var(--green)}

main{padding:36px 0 80px}
.rel-head{border-bottom:2px solid var(--black);padding-bottom:18px;margin-bottom:8px}
.rel-head h2{font-family:var(--f-display);text-transform:uppercase;font-size:clamp(1.6rem,4vw,2.6rem);line-height:1}
.rel-head .meta{font-family:var(--f-serif);font-style:italic;color:rgba(15,15,15,.6);font-size:1.05rem;margin-top:6px}

.alert{border-left:3px solid var(--red);background:rgba(179,0,27,.05);padding:14px 18px;margin-top:16px;font-size:.9rem}
.alert strong{color:var(--red)}

.fontes{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:rgba(15,15,15,.12);
 border:1px solid rgba(15,15,15,.12);margin-top:24px}
@media(min-width:700px){.fontes{grid-template-columns:repeat(4,1fr)}}
.fonte{background:var(--white);padding:18px 16px}
.fonte .k{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:rgba(15,15,15,.5)}
.fonte .v{font-family:var(--f-display);font-size:2.4rem;line-height:1;margin-top:8px}
.fonte .n{font-size:11px;color:rgba(15,15,15,.45);margin-top:4px}
.fonte.oculta .v{font-size:1rem;font-family:var(--f-body);color:rgba(15,15,15,.4);padding:8px 0}

h3.bloco{font-family:var(--f-display);text-transform:uppercase;font-size:1rem;letter-spacing:.02em;
 margin:32px 0 10px;padding-top:20px;border-top:1px solid rgba(15,15,15,.12)}
table{width:100%;border-collapse:collapse;font-size:.9rem;background:var(--white)}
th{background:var(--black);color:var(--off-white);font-size:9px;font-weight:700;text-transform:uppercase;
 letter-spacing:.1em;padding:9px 10px;text-align:center}
th:first-child{text-align:left}
td{padding:10px;border-top:1px solid rgba(15,15,15,.1);text-align:center}
td:first-child{text-align:left;font-weight:500}
tr:nth-child(even) td{background:rgba(15,15,15,.02)}
.gap-pos{color:var(--green-dark);font-weight:700}
.gap-neg{color:var(--red);font-weight:700}
.dim{color:rgba(15,15,15,.3)}

.coment{background:var(--white);border:1px solid rgba(15,15,15,.12);padding:20px;margin-top:12px}
.coment .fonte-tag{display:inline-block;font-size:9px;font-weight:700;text-transform:uppercase;
 letter-spacing:.12em;padding:4px 9px;line-height:1;margin-bottom:12px}
.tag-auto{background:var(--black);color:var(--off-white)}
.tag-gestor{background:var(--green);color:var(--black)}
.tag-anon{border:1px solid rgba(15,15,15,.3);color:rgba(15,15,15,.6)}
.coment p{margin-top:6px}
.coment .lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;
 color:rgba(15,15,15,.45);margin-top:14px}
.coment .lbl:first-of-type{margin-top:0}

.calib{background:var(--dark);color:var(--off-white);padding:24px;margin-top:32px}
.calib .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-top:16px}
@media(min-width:700px){.calib .grid{grid-template-columns:repeat(4,1fr)}}
.calib .k{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:rgba(245,244,240,.5)}
.calib .v{font-size:1.15rem;font-weight:600;margin-top:6px}
.calib .conf{border-left:3px solid var(--green);padding:12px 16px;margin-top:20px;
 background:rgba(245,244,240,.05);font-family:var(--f-serif);font-size:1rem}

.center{text-align:center;padding:80px 0}
.hidden{display:none!important}
.btn{font-family:var(--f-body);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;
 padding:12px 24px;border:none;cursor:pointer;background:var(--black);color:var(--off-white);
 display:inline-flex;align-items:center;gap:8px}
.btn:hover{background:var(--dark)}
footer{border-top:1px solid rgba(15,15,15,.1);padding:24px 0;font-size:11px;
 color:rgba(15,15,15,.45);text-align:center}
@media print{
  header .mark,nav.pessoas,footer,.no-print{display:none!important}
  body{background:#fff}
  .rel{page-break-after:always}
}
</style>
</head>
<body>

<header>
  <div class="mark">RPE</div>
  <div class="wrap inner">
    <div class="brand">RPE</div>
    <div class="section-label" style="margin-top:18px">Relatórios · Avaliação 360</div>
    <h1 id="hTitle">CARREGANDO…</h1>
    <p class="sub" id="hSub">Um instante.</p>
  </div>
</header>

<nav class="pessoas hidden" id="nav"><div class="wrap inner" id="navInner"></div></nav>

<main class="wrap">
  <section id="view"></section>
</main>

<footer class="wrap">
  Grupo RPE · Documento confidencial · Pares e time aparecem apenas em média, com 3 ou mais respondentes.
</footer>

<script>
const API = 'https://lqycimhfklufueclkzfr.supabase.co/functions/v1/avaliacao';
const TOKEN = new URLSearchParams(location.search).get('t') || '';
let DATA = null, ATUAL = 0;

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => (
  {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => (v == null ? null : Number(v));
const fmt = v => (v == null ? '—' : Number(v).toFixed(1).replace('.', ','));

const BLOCOS = {nucleo:'Comportamentos essenciais RPE', dir:'Competências de diretoria',
  ger:'Competências de gestão', asn:'Competências de execução', lid:'Liderança'};
const POT = {alto:'Alto', medio:'Médio', baixo:'Baixo'};
const PRONT = {pronto_agora:'Pronto agora', '1_2_anos':'Em 1 a 2 anos', nao_no_momento:'Não no momento'};

async function call(action){
  const r = await fetch(API, {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({action, token: TOKEN})});
  return r.json();
}

function renderNav(){
  $('nav').classList.remove('hidden');
  $('navInner').innerHTML = DATA.relatorios.map((r,i) =>
    '<button data-i="'+i+'" aria-current="'+(i===ATUAL)+'">'+esc(r.nome)+'</button>').join('');
  $('navInner').querySelectorAll('button').forEach(b =>
    b.addEventListener('click', () => { ATUAL = +b.dataset.i; render(); }));
}

function render(){
  const r = DATA.relatorios[ATUAL];
  const f = r.fontes || {};
  const auto = f.auto, gest = f.descendente, par = f.par, asc = f.ascendente;

  $('hTitle').innerHTML = 'RELATÓRIOS<br><em>' + esc(DATA.ciclo.ano) + '</em>';
  $('hSub').textContent = DATA.viewer.papel === 'rh'
    ? DATA.viewer.nome + ' · acesso completo, ' + DATA.relatorios.length + ' relatórios'
    : DATA.viewer.nome + ' · seu time, ' + DATA.relatorios.length + ' relatórios';

  const alertas = r.alertas || [];
  let h = '<div class="rel">';
  h += '<div class="rel-head"><h2>' + esc(r.nome) + '</h2><div class="meta">'
     + esc(r.cargo) + ' · ' + esc(r.area) + (r.gestor ? ' · reporta a ' + esc(r.gestor) : '')
     + '</div></div>';

  if (alertas.includes('sem_autoavaliacao'))
    h += '<div class="alert"><strong>Sem autoavaliação.</strong> Esta pessoa não preencheu a própria avaliação, '
       + 'então não há como comparar autopercepção com a visão dos outros. Comece a conversa perguntando como ela se avalia.</div>';
  if (alertas.includes('pares_ocultos'))
    h += '<div class="alert" style="border-left-color:rgba(15,15,15,.3)"><strong>Visão de pares não exibida.</strong> '
       + 'Menos de 3 pares responderam — mostrar a média identificaria quem escreveu o quê.</div>';
  if (alertas.includes('time_oculto'))
    h += '<div class="alert" style="border-left-color:rgba(15,15,15,.3)"><strong>Visão do time não exibida.</strong> '
       + 'Menos de 3 liderados responderam.</div>';

  h += '<div class="fontes">'
     + card('Autoavaliação', auto) + card('Gestor direto', gest)
     + card('Pares', par) + card('Time liderado', asc)
     + '</div>';

  // tabela por bloco
  let blocoAtual = '';
  (r.itens || []).forEach(it => {
    if (it.bloco !== blocoAtual){
      if (blocoAtual) h += '</tbody></table>';
      blocoAtual = it.bloco;
      h += '<h3 class="bloco">' + esc(BLOCOS[it.bloco] || it.bloco) + '</h3>'
         + '<table><thead><tr><th>Competência</th><th>Auto</th><th>Gestor</th><th>Pares</th><th>Time</th><th>Gap</th></tr></thead><tbody>';
    }
    const a = num(it.auto);
    const outras = [num(it.gestor), num(it.pares), num(it.time)].filter(v => v != null);
    const mediaOutras = outras.length ? outras.reduce((x,y)=>x+y,0)/outras.length : null;
    let gap = '', cls = '';
    if (a != null && mediaOutras != null){
      const d = mediaOutras - a;
      if (Math.abs(d) >= 0.5){ cls = d > 0 ? 'gap-pos' : 'gap-neg';
        gap = (d > 0 ? '+' : '') + d.toFixed(1).replace('.', ','); }
      else gap = '<span class="dim">≈</span>';
    } else gap = '<span class="dim">—</span>';
    h += '<tr><td>' + esc(it.titulo) + '</td>'
       + cel(it.auto) + cel(it.gestor) + cel(it.pares) + cel(it.time)
       + '<td class="' + cls + '">' + gap + '</td></tr>';
  });
  if (blocoAtual) h += '</tbody></table>';

  // comentários
  const cs = r.comentarios || [];
  if (cs.length){
    h += '<h3 class="bloco">O que as pessoas escreveram</h3>';
    cs.forEach(c => {
      const tag = c.fonte === 'Autoavaliação' ? 'tag-auto'
                : c.fonte === 'Gestor direto' ? 'tag-gestor' : 'tag-anon';
      h += '<div class="coment"><span class="fonte-tag ' + tag + '">' + esc(c.fonte)
         + (c.anonimo ? ' · anônimo' : '') + '</span>';
      if (c.forte) h += '<div class="lbl">Deve continuar fazendo</div><p>' + esc(c.forte) + '</p>';
      if (c.desenvolver) h += '<div class="lbl">Deve fazer diferente em 2027</div><p>' + esc(c.desenvolver) + '</p>';
      h += '</div>';
    });
  }

  // calibração
  if (r.calibracao){
    const c = r.calibracao;
    h += '<div class="calib"><div class="section-label">Bloco de calibração · confidencial</div>'
       + '<div class="grid">'
       + kv('Desempenho no ano', c.nota_geral ? c.nota_geral + ' / 5' : '—')
       + kv('Potencial', POT[c.potencial] || '—')
       + kv('Risco de perda', POT[c.risco_perda] || '—')
       + kv('Prontidão', PRONT[c.prontidao] || '—')
       + '</div>';
    if (c.comentario_rh)
      h += '<div class="conf"><strong style="font-family:var(--f-body);font-size:.8rem">Comentário para o RH:</strong><br>'
         + esc(c.comentario_rh) + '</div>';
    h += '</div>';
  }

  h += '<div class="no-print" style="margin-top:32px"><button class="btn" onclick="window.print()">Imprimir / salvar em PDF</button></div>';
  h += '</div>';
  $('view').innerHTML = h;
  $('navInner').querySelectorAll('button').forEach((b,i) => b.setAttribute('aria-current', i===ATUAL));
  window.scrollTo({top:0, behavior:'smooth'});
}

function card(nome, f){
  if (!f) return '<div class="fonte"><div class="k">' + nome + '</div><div class="v dim">—</div><div class="n">sem resposta</div></div>';
  if (!f.exibir) return '<div class="fonte oculta"><div class="k">' + nome + '</div><div class="v">Não exibida</div>'
    + '<div class="n">' + f.n + ' respondente(s) — mínimo 3</div></div>';
  return '<div class="fonte"><div class="k">' + nome + '</div><div class="v">' + fmt(f.media) + '</div>'
    + '<div class="n">' + f.n + ' respondente' + (f.n > 1 ? 's' : '') + '</div></div>';
}
function cel(v){ return '<td>' + (v == null ? '<span class="dim">—</span>' : fmt(v)) + '</td>'; }
function kv(k, v){ return '<div><div class="k">' + k + '</div><div class="v">' + esc(v) + '</div></div>'; }

function fail(t, s){
  $('hTitle').textContent = t.toUpperCase();
  $('hSub').textContent = s;
  $('view').innerHTML = '<div class="center"><p style="font-family:var(--f-serif);font-size:1.1rem;color:rgba(15,15,15,.6)">Fale com o RH do Grupo RPE.</p></div>';
}

(async function(){
  if (!TOKEN) return fail('Link inválido', 'Use o link que você recebeu do RH.');
  let r;
  try { r = await call('relatorios'); }
  catch(e){ return fail('Erro de conexão', 'Recarregue a página em alguns instantes.'); }
  if (!r || !r.ok) return fail('Link não reconhecido', 'Confira o endereço ou fale com o RH.');
  if (!r.relatorios || !r.relatorios.length)
    return fail('Nenhum relatório', 'Você não tem relatórios liberados neste ciclo.');
  DATA = r; renderNav(); render();
})();
</script>
</body>
</html>
